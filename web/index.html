<!doctype html>
<html><head><meta charset="utf-8"><title>Last Light</title><style>body{margin:0;background:#101b20;color:#eee;font:16px sans-serif;display:grid;place-items:center;min-height:100vh}main{text-align:center}canvas{image-rendering:pixelated;max-width:95vw;height:auto}button{margin:14px 6px;padding:8px 14px;background:#304b45;color:#eee;border:1px solid #88b59b;border-radius:4px;cursor:pointer}button:hover{background:#42675d}</style></head><body><main><div id="game"></div><button id="export-log">Export run log</button><span id="status"></span></main><script src="wasm_exec.js"></script><script>const go=new Go();WebAssembly.instantiateStreaming(fetch("game.wasm"),go.importObject).then(r=>go.run(r.instance));document.getElementById("export-log").onclick=()=>{const raw=localStorage.getItem("last-light-latest-run-log");const status=document.getElementById("status");if(!raw){status.textContent=" No completed run log found.";return}const blob=new Blob([raw],{type:"application/json"});const link=document.createElement("a");link.href=URL.createObjectURL(blob);link.download="last-light-run-log.json";link.click();URL.revokeObjectURL(link.href);status.textContent=" Log downloaded."};</script></body></html>
